<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2FA Live Code</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: #0f172a; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    main {
      width: min(560px, 100%);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 14px; font-size: 1.4rem; }
    label { display: block; font-size: .85rem; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 12px;
      border-radius: 12px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc;
      font-size: 1rem; outline: none;
    }
    input[type="text"] { letter-spacing: .06em; text-transform: uppercase; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .row label { margin: 0; }
    .code {
      margin: 22px 0 8px;
      text-align: center;
      font-size: clamp(2.2rem, 10vw, 3.6rem);
      font-weight: 800;
      letter-spacing: .12em;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      min-height: 1.2em;
    }
    .progress {
      height: 8px; background: #0f172a;
      border-radius: 999px; overflow: hidden;
      border: 1px solid #334155;
    }
    #bar {
      height: 100%; width: 100%;
      background: #38bdf8;
      transition: width .2s linear;
    }
    .meta {
      display: flex; justify-content: space-between;
      margin-top: 8px; color: #94a3b8; font-size: .9rem;
    }
    button {
      width: 100%; margin-top: 16px;
      padding: 13px 16px;
      border: 0; border-radius: 12px;
      background: #38bdf8; color: #0f172a;
      font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .hint { margin: 14px 0 0; color: #94a3b8; font-size: .8rem; line-height: 1.5; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <main>
    <h1>2FA Live Code</h1>
    <label for="secret">Base32 Secret</label>
    <input id="secret" type="text" placeholder="JBSWY3DPEHPK3PXP" autocomplete="off" autocapitalize="characters" spellcheck="false">

    <div class="row">
      <div>
        <label for="period">Period</label>
        <input id="period" type="number" value="30" min="1" max="120">
      </div>
      <div>
        <label for="digits">Digits</label>
        <select id="digits">
          <option value="6" selected>6</option>
          <option value="8">8</option>
        </select>
      </div>
      <div>
        <label for="algorithm">Algorithm</label>
        <select id="algorithm">
          <option value="SHA-1" selected>SHA-1</option>
          <option value="SHA-256">SHA-256</option>
          <option value="SHA-512">SHA-512</option>
        </select>
      </div>
    </div>

    <div class="code" id="code">------</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="meta">
      <span id="time">--s</span>
      <span id="status"></span>
    </div>

    <button id="copy" type="button">Copy Code</button>
    <p class="hint">সিক্রেট শুধু আপনার ব্রাউজারেই থাকে। কোনো সার্ভারে পাঠানো হয় না। প্রথমবার লোড হওয়ার পর অফলাইনেও কাজ করবে।</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const secretInput = $('secret');
    const periodInput = $('period');
    const digitsSelect = $('digits');
    const algorithmSelect = $('algorithm');
    const codeEl = $('code');
    const timeEl = $('time');
    const barEl = $('bar');
    const statusEl = $('status');
    const copyBtn = $('copy');

    let currentCode = '';
    let updating = false;

    // ✅ FIX: Base32 ডিকোডিং
    function base32ToBytes(base32) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      const clean = String(base32 || '')
        .replace(/=+$/g, '')
        .replace(/\s+/g, '')
        .toUpperCase();

      if (!clean) throw new Error('সিক্রেট খালি');

      let bits = 0;
      let value = 0;
      const output = [];

      for (const ch of clean) {
        const idx = alphabet.indexOf(ch);
        if (idx === -1) throw new Error('ভুল Base32 অক্ষর: ' + ch);

        value = (value << 5) | idx;
        bits += 5;

        if (bits >= 8) {
          bits -= 8;
          output.push((value >>> bits) & 0xff);
          value &= (1 << bits) - 1; // 🔴 গুরুত্বপূর্ণ ফিক্স
        }
      }

      return new Uint8Array(output);
    }

    async function generateTOTP(secret, period = 30, digits = 6, algorithm = 'SHA-1') {
      const keyBytes = base32ToBytes(secret);
      const counter = BigInt(Math.floor(Date.now() / 1000 / period));

      const buffer = new ArrayBuffer(8);
      const view = new DataView(buffer);
      view.setBigUint64(0, counter, false);

      const cryptoKey = await crypto.subtle.importKey(
        'raw',
        keyBytes,
        { name: 'HMAC', hash: algorithm },
        false,
        ['sign']
      );

      const signature = await crypto.subtle.sign('HMAC', cryptoKey, buffer);
      const hmac = new Uint8Array(signature);
      const offset = hmac[hmac.length - 1] & 0x0f;

      const binary =
        ((hmac[offset] & 0x7f) << 24) |
        ((hmac[offset + 1] & 0xff) << 16) |
        ((hmac[offset + 2] & 0xff) << 8) |
        (hmac[offset + 3] & 0xff);

      const otp = binary % (10 ** digits);
      return String(otp).padStart(digits, '0');
    }

    async function update() {
      if (updating) return;
      updating = true;

      try {
        const secret = secretInput.value.trim();
        const period = Math.max(1, Number(periodInput.value) || 30);
        const digits = Number(digitsSelect.value) || 6;
        const algorithm = algorithmSelect.value;

        if (!secret) {
          currentCode = '';
          codeEl.textContent = '------';
          timeEl.textContent = '--s';
          barEl.style.width = '100%';
          statusEl.textContent = '';
          return;
        }

        const code = await generateTOTP(secret, period, digits, algorithm);
        currentCode = code;
        codeEl.textContent = code;
        codeEl.classList.remove('error');

        const now = Math.floor(Date.now() / 1000);
        const remaining = period - (now % period);
        timeEl.textContent = remaining + 's';
        barEl.style.width = ((remaining / period) * 100) + '%';
        statusEl.textContent = '';
      } catch (err) {
        currentCode = '';
        codeEl.textContent = 'ERROR';
        codeEl.classList.add('error');
        timeEl.textContent = '--s';
        barEl.style.width = '0%';
        statusEl.textContent = err.message;
      } finally {
        updating = false;
      }
    }

    copyBtn.addEventListener('click', async () => {
      if (!currentCode) return;
      try {
        await navigator.clipboard.writeText(currentCode);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => (copyBtn.textContent = 'Copy Code'), 1200);
      } catch {
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => (copyBtn.textContent = 'Copy Code'), 1200);
      }
    });

    secretInput.addEventListener('input', update);
    periodInput.addEventListener('input', update);
    digitsSelect.addEventListener('change', update);
    algorithmSelect.addEventListener('change', update);

    update();
    setInterval(update, 1000);

    // ✅ FIX: অফলাইন PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
